name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fails if the word list has drifted from the canonical BIP-39 file,
      # or if index.html is not exactly what scripts/build.py produces.
      - name: Verify word list and reproducible build
        run: ./scripts/verify.sh

      # The remote-asset check lives in verify.sh now. It was a grep here, and a
      # grep stops checking anything the moment the file looks binary to it,
      # which is what a stray NUL byte in the prose did. It reads bytes now.

      # And this proves the checks above still work, by breaking each invariant
      # on purpose in a throwaway copy. A guard that has quit still prints a tick,
      # so the ticks are not evidence on their own.
      - name: Prove the guards still catch what they claim
        run: python3 scripts/selfcheck.py
