name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The committed index.html is what gets published — the same bytes
      # anyone can rebuild and audit with scripts/verify.sh.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp data/english.txt _site/english.txt
          # The offline procedure on the site tells readers to check the file
          # they downloaded against a published hash, so publish one. It is a
          # weak check on its own, since whoever serves the page serves this
          # too. The strong check is cloning the repository and running
          # scripts/verify.sh, which rebuilds index.html and diffs it.
          sha256sum index.html | cut -d' ' -f1 > _site/index.html.sha256
          sha256sum data/english.txt | cut -d' ' -f1 > _site/english.txt.sha256

          # Crawlers: one page, one URL. The sections live behind a fragment,
          # which is not a separate document to a crawler, so the sitemap says
          # so rather than pretending otherwise.
          printf 'User-agent: *\nAllow: /\nSitemap: https://chemaclass.github.io/bip39-entropy/sitemap.xml\n' > _site/robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url>\n    <loc>https://chemaclass.github.io/bip39-entropy/</loc>\n    <lastmod>%s</lastmod>\n    <changefreq>weekly</changefreq>\n    <priority>1.0</priority>\n  </url>\n</urlset>\n' "$(date -u +%%Y-%%m-%%d)" > _site/sitemap.xml
          cp og.png _site/og.png

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
