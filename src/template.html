<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIP-39 · The Eleven-Bit Address Space</title>
<meta name="description" content="What entropy is, why a seed phrase needs 128 bits of it, how to roll your own with dice or coins, and a printable poster of all 2048 BIP-39 words. Works offline, no network.">
<style id="pagestyle">@page { size: 210mm 297mm; margin: 0; }</style>
<style>
__CSS__
</style>
</head>
<body>

<div class="chrome">
  <div class="top">
    <div class="top-in">
      <a class="brand" id="brandlink" href="#poster"><b>BIP-39</b><span data-t="brand.tag"></span></a>
      <nav class="tabs" id="tabs" data-t-attr="aria-label:nav.aria">
        <a href="#poster" data-view="poster" data-t="nav.poster"></a>
        <a href="#start" data-view="start" data-t="nav.start"></a>
        <a href="#learn" data-view="learn" data-t="nav.learn"></a>
        <a href="#roll" data-view="roll" data-t="nav.roll"></a>
        <a href="#faq" data-view="faq" data-t="nav.faq"></a>
      </nav>
      <a class="save" id="save" href="index.html" download="bip39-poster.html"
         data-t="nav.save" data-t-attr="title:nav.saveHint"></a>
      <div class="langsel">
        <label for="lang" class="vh" data-t="lang.label"></label>
        <select id="lang" data-t-attr="aria-label:lang.label"></select>
      </div>
    </div>
  </div>

  <div class="bar" id="bar">
    <div class="bar-in">
      <div class="ctl">
        <label for="paper" data-t="bar.paper"></label>
        <select id="paper">
          <option value="A4" selected>A4 · 210 × 297</option>
          <option value="A3">A3 · 297 × 420</option>
          <option value="A2">A2 · 420 × 594</option>
          <option value="A1">A1 · 594 × 841</option>
          <option value="Letter">Letter · 8.5 × 11</option>
          <option value="Tabloid">Tabloid · 11 × 17</option>
        </select>
      </div>

      <div class="ctl">
        <label for="orient" data-t="bar.orientation"></label>
        <select id="orient">
          <option value="p" selected data-t="orient.portrait"></option>
          <option value="l" data-t="orient.landscape"></option>
        </select>
      </div>

      <div class="ctl">
        <label for="split" data-t="bar.grid"></label>
        <select id="split">
          <option value="auto" selected data-t="grid.auto"></option>
          <option value="16x128:16x128" data-t="grid.16x128"></option>
          <option value="32x64:32x64" data-t="grid.32x64"></option>
          <option value="16x128:16x64" data-t="grid.16x64"></option>
          <option value="16x128:8x128" data-t="grid.8x128"></option>
          <option value="16x128:8x64" data-t="grid.8x64"></option>
          <option value="16x128:4x64" data-t="grid.4x64"></option>
        </select>
      </div>

      <div class="ctl">
        <label for="face" data-t="bar.face"></label>
        <select id="face">
          <option value="grot" selected data-t="face.grot"></option>
          <option value="serif" data-t="face.serif"></option>
          <option value="mono" data-t="face.mono"></option>
        </select>
      </div>

      <div class="ctl">
        <label for="find" data-t="bar.find"></label>
        <input id="find" type="search" data-t-attr="placeholder:bar.findPlaceholder" autocomplete="off" spellcheck="false">
      </div>

      <div class="ctl">
        <label>&nbsp;</label>
        <div class="toggles">
          <label class="tg"><input type="checkbox" id="prefix" checked> <span data-t="toggle.prefix"></span></label>
          <label class="tg"><input type="checkbox" id="rules" checked> <span data-t="toggle.rules"></span></label>
          <button id="pdf" data-t="btn.pdf"></button>
          <button class="btn-print" id="print" data-t="btn.print"></button>
        </div>
      </div>
    </div>

    <div class="readout" id="readout"></div>
  </div>
</div>

<main>
  <div class="view" id="view-poster">
    <div class="stage" id="stage"></div>
  </div>

__CONTENT__

  <div class="view" id="view-roll" hidden>
    <section class="roll">
      <h2 class="roll-h" data-t="roll.title"></h2>
      <p class="roll-lead"><span data-t="roll.lead"></span> <span id="rollleadlink"></span></p>

      <aside class="roll-warn"><b data-t="roll.warnLead"></b> <span id="rollwarntext"></span></aside>

      <div class="roll-ctl">
        <div class="ctl">
          <label for="strength" data-t="roll.length"></label>
          <select id="strength">
            <option value="12" selected data-t="roll.words12"></option>
            <option value="24" data-t="roll.words24"></option>
          </select>
        </div>
        <div class="ctl">
          <label for="method" data-t="roll.source"></label>
          <select id="method">
            <option value="dice" selected data-t="roll.dice"></option>
            <option value="coin" data-t="roll.coin"></option>
          </select>
        </div>
        <div class="ctl">
          <label for="rollload" data-t="roll.load"></label>
          <div class="toggles">
            <input id="rollload" type="text" inputmode="numeric" autocomplete="off"
                   spellcheck="false" data-t-attr="placeholder:roll.loadPlaceholder">
            <button id="rollloadgo" data-t="btn.load"></button>
          </div>
        </div>
        <div class="ctl">
          <label>&nbsp;</label>
          <div class="toggles">
            <button id="rollundo" data-t="btn.undo"></button>
            <button id="rollclear" data-t="btn.clear"></button>
            <button id="rollsheet" data-t="btn.worksheet"></button>
          </div>
        </div>
      </div>

      <p class="roll-err" id="rollerr" hidden></p>

      <div class="roll-pad" id="rollpad"></div>
      <p class="roll-hint" id="rollhint"></p>

      <div class="roll-meter"><div class="roll-meter-fill" id="rollfill"></div></div>
      <div class="roll-count" id="rollcount"></div>

      <div class="roll-bits" id="rollbits"></div>
      <div class="roll-out" id="rollout"></div>
    </section>
  </div>
</main>

<script>
__JS__
</script>
</body>
</html>
