  "mainEntity": [
   {
    "@type": "Question",
    "name": "Should I use 12 or 24 words?",
    "acceptedAnswer": {
     "@type": "Answer",
     "text": "Twelve words carry 128 bits of entropy and twenty-four carry 256. 128 bits is already past what brute force can reach, so 24 is not stronger against any attack that exists today. It is a hedge against future cryptanalysis and against Grover-style quantum search. Both lengths work in every conforming wallet."
    }
   },
   {
    "@type": "Question",
    "name": "Can I choose the words of my seed phrase myself?",
    "acceptedAnswer": {
     "@type": "Answer",
     "text": "No. Entropy is measured against what an attacker knows about how you chose, not against how arbitrary the result feels. Picking twelve words from a shortlist of thirty-two memorable ones is sixty bits, which a serious hardware budget works through. The checksum will not save you, because it checks transcription and nothing else."
    }
   },
   {
    "@type": "Question",
    "name": "Is it safe to print the whole BIP-39 word list?",
    "acceptedAnswer": {
     "@type": "Answer",
     "text": "Yes. The list is public and identical in every wallet, so a printed copy reveals nothing. What is dangerous is marking your own words on it. Twelve ticks on a grid of 2048 is a plaintext copy of your recovery phrase."
    }
   },
   {
    "@type": "Question",
    "name": "What is a BIP-39 passphrase, the 25th word?",
    "acceptedAnswer": {
     "@type": "Answer",
     "text": "An extra secret mixed into the derivation, so the same twelve words with a different passphrase produce a completely different wallet. It means the paper backup alone cannot spend. It has no checksum, a typo opens a valid empty wallet instead of failing, and forgetting it loses the coins as completely as losing the phrase."
    }
   },
   {
    "@type": "Question",
    "name": "Does the order of the seed phrase words matter?",
    "acceptedAnswer": {
     "@type": "Answer",
     "text": "Completely. The phrase is one number cut into eleven-bit groups, and each word is the group at a fixed position. Moving two words changes the number. A swap usually fails the checksum, but about one such mistake in sixteen passes it on a twelve-word phrase."
    }
   }
  ]
 }
